[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# 0.8.26 is required by Uniswap v4 core (ArcFlow). TokenLocker/Vesting/Airdrop are ^0.8.24 and
# were verified as 0.8.24 builds; see verification/ for their exact settings.
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "v4-core/=lib/v4-core/",
    "v4-periphery/=lib/v4-periphery/",
    "solmate/=lib/v4-core/lib/solmate/",
    "permit2/=lib/v4-periphery/lib/permit2/",
]
# ArcFlow fork tests read live Arc state; pass --fork-url at the CLI (private RPC lives in .env).
[profile.default.fuzz]
runs = 512

[fuzz]
runs = 512

[fmt]
line_length = 120
